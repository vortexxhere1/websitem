<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexxHere - Linklerim</title>
    <!-- FontAwesome İkonları için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stil Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Profil Fotoğrafı ve Bilgileri -->
        <div class="profile-container">
            <a href="https://discord.com" target="_blank" title="Profili Ziyaret Et">
                <img src="avatar.jpg" alt="Profil Resmi" class="avatar">
            </a>
            <h1 id="profile-name">Yükleniyor...</h1>
            <p id="profile-bio">Yükleniyor...</p>
        </div>

        <!-- Dinamik Linklerin Geleceği Alan -->
        <div id="links-container" class="links-container">
            <!-- JavaScript burayı otomatik dolduracak -->
        </div>

        <!-- Alt Bilgi -->
        <footer class="footer">
            <p>&copy; 2026 - Tüm Hakları Saklıdır.</p>
        </footer>
    </div>

    <!-- JavaScript Dosyası -->
    <script src="app.js"></script>
</body>
</html>
